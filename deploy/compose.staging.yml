services:
  web-staging:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    env_file:
      - path: ../.env.staging
        required: false
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATA_DIR: /app/data
      TRUST_PROXY: "1"
      TRUST_PROXY_CIDRS: "${TRUST_PROXY_CIDRS:-172.16.0.0/12}"
      # PUBLIC_ORIGIN: https://staging.your-domain.example
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - repairlylabs_staging_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    init: true
volumes:
  repairlylabs_staging_data:
