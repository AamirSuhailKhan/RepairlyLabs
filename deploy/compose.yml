services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Set PUBLIC_ORIGIN to the actual HTTPS storefront URL before deployment.
      # PUBLIC_ORIGIN: https://your-domain.example
      DATA_DIR: /app/data
      # Optional, configure via secure environment variables:
      # NOTIFY_WEBHOOK_URL: https://...
      # NOTIFY_WEBHOOK_SECRET: ...
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - repairlylabs_data:/app/data
    init: true
volumes:
  repairlylabs_data:
